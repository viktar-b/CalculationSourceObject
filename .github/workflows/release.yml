name: Release packages

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registries to publish, using versions in the manifests
        type: choice
        options: [all, npm, python]
        default: all
        required: true

permissions:
  contents: read

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  npm:
    needs: checks
    if: inputs.registry == 'all' || inputs.registry == 'npm'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run build:cli
      - name: Publish unreleased npm versions in dependency order
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          for directory in ['cso-core', 'cso-react', 'cso-cli', 'create-cs-object']:
              path = Path('packages') / directory
              package = json.loads((path / 'package.json').read_text())
              name, version = package['name'], package['version']
              url = 'https://registry.npmjs.org/' + urllib.parse.quote(name, safe='')
              try:
                  with urllib.request.urlopen(url) as response:
                      published = json.load(response)['versions']
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  published = {}
              if version in published:
                  print(f'Skipping published {name}@{version}', flush=True)
                  continue
              subprocess.run(['npm', 'publish', '--workspace', name, '--access', 'public'], check=True)
          PY

  python:
    needs: checks
    if: inputs.registry == 'all' || inputs.registry == 'python'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install build twine
      - run: python -m build packages/cso-python --outdir dist
      - run: python -m twine check --strict dist/*
      - name: Publish Python distributions with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
