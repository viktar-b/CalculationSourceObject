name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: npm ci
      - name: Install the Python wheel
        run: |
          python -m venv .venv
          .venv/bin/python -m pip wheel --no-deps ./packages/cso-python --wheel-dir artifacts
          .venv/bin/python -m pip install --no-index --find-links artifacts cs-object
          .venv/bin/python -m pip install -r packages/cso-python/tests/requirements.txt
          echo "PYTHON=$GITHUB_WORKSPACE/.venv/bin/python" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm audit --audit-level=high
      - run: npm run test:pr-title
      - run: npm run test:ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build remaining package entrypoints
        run: npm run build --workspace @cs-object/cli && npm run build --workspace create-cs-object
      - run: npm --ignore-scripts test
      - name: Build the demo with the checked packages
        run: npx tsx scripts/demo.ts build

  isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Build and test each project in isolation
        run: TMPDIR="$RUNNER_TEMP" npm run test:isolation 2>&1 | tee "$RUNNER_TEMP/isolation.log"
      - name: Retain isolation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolation-evidence
          retention-days: 14
          path: |
            ${{ runner.temp }}/isolation.log
            ${{ runner.temp }}/cso-isolated-projects-*/*.json
            ${{ runner.temp }}/cso-isolated-projects-*/*.log

  installed-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Install PDF prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          npx playwright install --with-deps chromium
      - name: Test installed archives, wheel, library and initializer consumers
        run: TMPDIR="$RUNNER_TEMP" npm run test:packages 2>&1 | tee "$RUNNER_TEMP/installed-packages.log"
      - name: Retain package and PDF evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-package-evidence
          retention-days: 14
          path: |
            ${{ runner.temp }}/installed-packages.log
            ${{ runner.temp }}/cso installed packages */*.json
            ${{ runner.temp }}/cso installed packages */*.log
            ${{ runner.temp }}/cso installed packages */*.png
            ${{ runner.temp }}/cso installed packages */*.pdf
            ${{ runner.temp }}/cso installed packages */*.html
            ${{ runner.temp }}/cso installed packages */archives/*
            ${{ runner.temp }}/cso installed packages */full cli/*-results.json
            ${{ runner.temp }}/cso installed packages */full cli/output/*
            ${{ runner.temp }}/cso installed packages */full cli/pdf-output/**

  windows-installed:
    name: windows-installed (${{ matrix.id }})
    runs-on: windows-2025
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: powershell-5.1
            edition: Desktop
            major: '5'
          - id: pwsh-7
            edition: Core
            major: '7'
    env:
      CSO_WINDOWS_SHELL_ID: ${{ matrix.id }}
      CSO_WINDOWS_EXPECTED_EDITION: ${{ matrix.edition }}
      CSO_WINDOWS_EXPECTED_MAJOR: ${{ matrix.major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Run the installed-user workflow in PowerShell 5.1
        if: ${{ matrix.id == 'powershell-5.1' }}
        shell: powershell
        run: '& .\tests\integration\installed\windows-user-workflow.ps1'
      - name: Run the installed-user workflow in PowerShell 7
        if: ${{ matrix.id == 'pwsh-7' }}
        shell: pwsh
        run: '& .\tests\integration\installed\windows-user-workflow.ps1'
      - name: Retain Windows workflow evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installed-${{ matrix.id }}
          retention-days: 14
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/cso installed packages ${{ matrix.id }} é/*.json
            ${{ runner.temp }}/cso installed packages ${{ matrix.id }} é/*.log
            ${{ runner.temp }}/cso installed packages ${{ matrix.id }} é/*.png
            ${{ runner.temp }}/cso installed packages ${{ matrix.id }} é/*.html
            ${{ runner.temp }}/cso installed packages ${{ matrix.id }} é/*.pdf
            ${{ runner.temp }}/cso installed packages ${{ matrix.id }} é/my-report/.gitattributes
            ${{ runner.temp }}/cso installed packages ${{ matrix.id }} é/my-report/reports.json
            ${{ runner.temp }}/cso installed packages ${{ matrix.id }} é/my-report/references/*.json
            ${{ runner.temp }}/cso installed packages ${{ matrix.id }} é/my-report/calculations/reference.json
            ${{ runner.temp }}/cso installed packages ${{ matrix.id }} é/my-report/calculations/_cso_bindings/**/*.py
            ${{ runner.temp }}/cso installed packages ${{ matrix.id }} é/my-report/calculations/_cso_bindings/**/*.pyi
            ${{ runner.temp }}/cso installed packages ${{ matrix.id }} é/my-report/output/*.html
            ${{ runner.temp }}/cso installed packages ${{ matrix.id }} é/my-report/output/*.pdf
            ${{ github.workspace }}/output/panels.html
            ${{ github.workspace }}/output/panels.pdf
